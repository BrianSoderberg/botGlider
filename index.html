<!DOCTYPE html>

<title>Shifting Arena — Knock-off</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6f5; touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none;

  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 8px; left: 8px; font-size: 12px; line-height: 1.45; display: none;

  #hud b { font-weight: 600; }
  #helpBtn, #leaveBtn { position: fixed; top: 8px; height: 30px; border-radius: 15px; display: none;

  #leaveBtn { right: 8px; padding: 0 12px; font-size: 12px; }
  #score { position: fixed; top: 44px; right: 8px; display: none; flex-direction: column; gap: 4px;

  #goBtn { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 5;

  #banner { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 700;

    pointer-events: none; }
  #glideWrap { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: 140px; height: 8px;

  #glideBar { height: 100%; width: 100%; background: #2BB3A8; }
  /* Nav control: outer ring (turn zone) + inner circle (sidestep zone) + dot */
  #stickBase, #stickInner { position: fixed; border-radius: 50%; display: none; pointer-events: none; box-sizing: border-box; }

  #stickKnob.touch { width: 34px; height: 34px; margin: -17px 0 0 -17px; }
  #stickKnob.strafe { background: #2BB3A8; }
  #stickKnob.rotate { background: #FF8A3D; }
  #stickKnob.active { transform: scale(1.35); }
  .tbtn { position: fixed; right: 22px; width: 80px; height: 80px; border-radius: 50%; flex-direction: column; line-height: 1.1;
    border: 3px solid #1E2A38; background: rgba(255,255,255,0.6); font-size: 15px; font-weight: 600;
    display: none; align-items: center; justify-content: center; touch-action: none; }
  #fireBtn { bottom: 214px; }
  #jumpBtn { bottom: 122px; }

  #strafeBtn.down { background: rgba(140,107,255,0.6); }

  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(191,230,245,0.82); }
  #panel { background: #fff; border-radius: 16px; padding: 18px 20px; width: min(320px, 86vw);
    box-shadow: 0 4px 18px rgba(30,42,56,0.15); }
  #panel h1 { font-size: 22px; margin: 0 0 2px; }
  #panel .sub { font-size: 13px; color: #5a6675; margin: 0 0 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; font-size: 15px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #1E2A38; background: #fff;

  .big { width: 100%; height: 44px; border-radius: 10px; border: none; font-size: 16px; font-weight: 600;
    margin-top: 8px; color: #fff; background: #2BB3A8; }

  .big.ghost { background: #fff; color: #1E2A38; border: 2px solid #1E2A38; }
  #nameIn { height: 36px; width: 55%; border-radius: 10px; border: 2px solid #1E2A38; font-size: 16px; padding: 0 10px;
    color: #1E2A38; box-sizing: border-box; }
  #modeSel { height: 36px; border-radius: 10px; border: 2px solid #1E2A38; font-size: 15px; background: #fff;

  #joinRow button { margin: 0; width: 90px; }
  #gamesBox { border-bottom: 1px solid #e3e6ea; padding-bottom: 8px; margin-bottom: 4px; }
  #gamesList { display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto; }
  #gamesList .none { font-size: 13px; color: #5a6675; }

    padding: 24px; font-size: 15px; }
</style>

<div id="menu">
  <div id="panel">
    <h1>Shifting Arena</h1>
    <p class="sub">Knock-off: push everyone into the holes. Last one standing wins.</p>
    <div class="row" style="margin-top:0">Your name <input id="nameIn" maxlength="12" placeholder="Name" autocomplete="off"></div>
    <div id="gamesBox">
      <div class="row" style="margin-top:0"><b style="font-size:15px">Open games</b><button id="refreshBtn" class="small">Refresh</button></div>

    <div class="row">Falls allowed <div class="stepper"><button data-k="lives" data-d="-1">−</button><span id="livesVal">3</span><button data-k="lives" data-d="1">+</button></div></div>
    <div class="row">Bots <div class="stepper"><button data-k="bots" data-d="-1">−</button><span id="botsVal">3</span><button data-k="bots" data-d="1">+</button></div></div>
    <div class="row">Bot skill <div class="stepper"><button data-k="skill" data-d="-1">−</button><span id="skillVal" style="min-width:64px">Easy</span><button data-k="skill" data-d="1">+</button></div></div>

  </div>
</div>
<div id="err">Couldn't start 3D. This page needs WebGL and access to unpkg.com.</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

// ================= Tuning =================
const STEP = 1 / 60;
const PLAYER_R = 0.4, PLAYER_H = 1.6;
const RUN_SPEED = 6.5, GRAVITY = 26, JUMP_VEL = 9.2;
const GLIDE_MAX = 1.3, GLIDE_FALL = 1.6;
const COYOTE = 0.15, JUMP_BUFFER = 0.15;
const MANTLE_MAX = 1.35;
const TURN_RATE = 2.6;
const ARENA = 40, TILE = 4, TILES = ARENA / TILE;
const FALL_Y = -12, RESPAWN_DELAY = 1.5, ROUND_END_DELAY = 3.5;
const FIRE_COOLDOWN = 0.22, SHOT_SPEED = 22, SHOT_LIFE = 1.6, SHOT_R = 0.16;
const KNOCK = 9, KNOCK_UP = 3.5, STUN = 0.45;
const PITCH = 0.665;   // ~38° down, so more of the playfield is visible
const SNAP_RATE = 1 / 20, INPUT_RATE = 1 / 30;
// Bot skill = f(move speed, shots per second, aim accuracy, turn speed)
const BOT_SKILLS = [
  { name: 'Easy',   speed: 0.33, cooldown: 0.75, aim: 0.7,  turn: 1.6, range: 14 },
  { name: 'Normal', speed: 0.8,  cooldown: 0.42, aim: 0.35, turn: 2.4, range: 17 },
  { name: 'Hard',   speed: 1.0,  cooldown: 0.22, aim: 0.12, turn: 3.2, range: 20 },
];
const ROOM_PREFIX = 'shiftarena-';

const INK = 0x1E2A38, ACCENT = 0xFFC93C;
const COLORS = [0x2BB3A8, 0xFF8A3D, 0xFF5C8A, 0x8C6BFF];
const COLOR_NAMES = ['Teal', 'Orange', 'Pink', 'Purple'];
const COLOR_CSS = ['#2BB3A8', '#FF8A3D', '#FF5C8A', '#8C6BFF'];
const SPAWNS = [[0, -18], [0, 18], [-18, 0], [18, 0]];

// ================= Renderer / scene =================
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
renderer.setClearColor(0xbfe6f5);
renderer.autoClear = false;   // we draw in passes: world, nav discs, then your character on top
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
const hemi = new THREE.HemisphereLight(0xffffff, 0xb8a98f, 1.1);
hemi.layers.enable(1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(12, 30, 8);
sun.castShadow = true;
sun.layers.enable(1);
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 80 });
sun.shadow.bias = -0.0008;
scene.add(sun);

const gradTex = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 180, 180, 180, 255, 255, 255, 255, 255]), 3, 1);
gradTex.minFilter = gradTex.magFilter = THREE.NearestFilter;
gradTex.needsUpdate = true;
const toon = (color) => new THREE.MeshToonMaterial({ color, gradientMap: gradTex });

// ================= Solids (axis-aligned columns) =================
const solids = [];
function makeColumn({ x, z, w, d, h, y0 = 0, color, material }) {
  const geo = new THREE.BoxGeometry(w, 1, d);
  geo.translate(0, 0.5, 0);
  const mesh = new THREE.Mesh(geo, material || toon(color));
  mesh.position.set(x, y0, z);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  const s = { x, z, w, d, y0, h, mesh, dy: 0, min: new THREE.Vector3(), max: new THREE.Vector3() };
  setHeight(s, h);
  solids.push(s);
  return s;
}
function setHeight(s, h) {
  const oldTop = s.max.y;
  s.h = Math.max(h, 0.001);
  s.mesh.scale.y = s.h;
  s.min.set(s.x - s.w / 2, s.y0, s.z - s.d / 2);
  s.max.set(s.x + s.w / 2, s.y0 + s.h, s.z + s.d / 2);
  s.dy = s.max.y - oldTop;
}

// ================= Arena: tiled floor with holes, no walls =================
// Holes have 4-way rotational symmetry so every spawn side is equal.
const HOLES = new Set(['2,2', '7,2', '7,7', '2,7', '0,3', '6,0', '9,6', '3,9', '3,3', '6,3', '6,6', '3,6']);
const tileMatA = toon(0xEFE9DC), tileMatB = toon(0xE4DCCB);
for (let i = 0; i < TILES; i++) {
  for (let j = 0; j < TILES; j++) {
    if (HOLES.has(i + ',' + j)) continue;
    makeColumn({ x: -ARENA / 2 + TILE * (i + 0.5), z: -ARENA / 2 + TILE * (j + 0.5), w: TILE, d: TILE, h: 1, y0: -1,
      material: (i + j) % 2 ? tileMatA : tileMatB });
  }
}
const STATIC = 0xD9D2C3;
for (const s of [-1, 1]) {
  makeColumn({ x: -6, z: 10 * s, w: 2, d: 2, h: 1.2, color: STATIC });
  makeColumn({ x: 6, z: 10 * s, w: 2, d: 2, h: 1.2, color: STATIC });
  makeColumn({ x: -12, z: 5 * s, w: 1, d: 3.5, h: 2.4, color: STATIC });
  makeColumn({ x: 12, z: 5 * s, w: 1, d: 3.5, h: 2.4, color: STATIC });
}
for (let k = 0; k < 4; k++) {   // spawn pads
  const m = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.04, 32),
    new THREE.MeshBasicMaterial({ color: COLORS[k], transparent: true, opacity: 0.3, depthWrite: false }));
  m.position.set(SPAWNS[k][0], 0.03, SPAWNS[k][1]);
  scene.add(m);
}

// ================= Dynamic elements: switched by players =================
// Each lift / cover has a trigger zone: its footprint plus a margin of floor around it (shown as a yellow pad).
// Walking into the zone (or onto the element) toggles it up or down. State lives on the host and is sent to clients.
const smooth = (u) => u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;
const ZONE_MARGIN = 1.2;      // meters of floor around the element that also trigger it
const TOGGLE_COOLDOWN = 1.0;  // seconds after a move finishes before it can toggle again
const ELEMENT_HP = 12;        // shots it takes to wreck a lift or cover
const WRECK_COLOR = new THREE.Color(0xB9B4AA), LIVE_COLOR = new THREE.Color(ACCENT);
const dynamics = [];
function addDynamic(opts, cfg, startUp) {
  const mat = toon(ACCENT);
  mat.emissive = new THREE.Color(0xffffff);
  mat.emissiveIntensity = 0;
  const h0 = startUp ? cfg.high : cfg.low;
  const s = makeColumn({ ...opts, h: h0, material: mat });
  const zw = opts.w + ZONE_MARGIN * 2, zd = opts.d + ZONE_MARGIN * 2;
  const zoneMat = new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: 0.22, depthWrite: false });
  const zone = new THREE.Mesh(new THREE.PlaneGeometry(zw, zd), zoneMat);
  zone.rotation.x = -Math.PI / 2;
  zone.position.set(opts.x, 0.015, opts.z);
  scene.add(zone);
  const d = { s, cfg, mat, zone, zoneMat, startUp, hp: ELEMENT_HP, up: startUp, from: h0, to: h0, t0: -100, lastToggle: -100,
    zx0: opts.x - zw / 2, zx1: opts.x + zw / 2, zz0: opts.z - zd / 2, zz1: opts.z + zd / 2, inside: new Set() };
  dynamics.push(d);
}
function heightAt(d, t) { if (d.hp <= 0) return 0.001; return lerp(d.from, d.to, smooth(THREE.MathUtils.clamp((t - d.t0) / d.cfg.move, 0, 1))); }
function moving(d, t) { return t - d.t0 < d.cfg.move; }
function toggleDynamic(d, t) {
  d.from = heightAt(d, t);
  d.up = !d.up;
  d.to = d.up ? d.cfg.high : d.cfg.low;
  d.t0 = t;
  d.lastToggle = t;
}
function resetDynamics() {
  for (const d of dynamics) {
    d.up = d.startUp; d.from = d.to = d.up ? d.cfg.high : d.cfg.low; d.t0 = -100; d.inside.clear();
    d.hp = ELEMENT_HP;   // repaired every round
  }
}
const LIFT = { low: 0.6, high: 4.0, move: 1.5 };
addDynamic({ x: -9, z: 0, w: 4, d: 4 }, LIFT, false);
addDynamic({ x: 9, z: 0, w: 4, d: 4 }, LIFT, false);
const COVER = { low: 0.02, high: 2.2, move: 0.6 };
addDynamic({ x: 0, z: -6, w: 3, d: 0.8 }, COVER, true);
addDynamic({ x: 0, z: 6, w: 3, d: 0.8 }, COVER, true);
addDynamic({ x: 0, z: 0, w: 4, d: 0.8 }, COVER, false);

function updateDynamics(t) { for (const d of dynamics) setHeight(d.s, heightAt(d, t)); }
// Host only: a player entering a zone (or stepping onto the element) toggles it
function checkTriggers(t) {
  for (const d of dynamics) {
    if (d.hp <= 0) continue;   // wrecked elements no longer switch
    for (const pl of players) {
      const p = pl.pos;
      const inZone = pl.alive && p.x > d.zx0 && p.x < d.zx1 && p.z > d.zz0 && p.z < d.zz1 &&
                     p.y > -0.5 && p.y <= d.s.max.y + 0.3;   // on the floor pad or standing on the element
      const was = d.inside.has(pl.slot);
      if (inZone && !was) {
        d.inside.add(pl.slot);
        if (!moving(d, t) && t - (d.t0 + d.cfg.move) >= TOGGLE_COOLDOWN) toggleDynamic(d, t);
      } else if (!inZone && was) d.inside.delete(pl.slot);
    }
  }
}
function drawDynamics(t) {
  for (const d of dynamics) {
    const h = heightAt(d, t);
    d.s.mesh.scale.y = Math.max(h, 0.001);
    // Damage fades the color from yellow toward gray; wrecked = gone, pad switched off
    const wrecked = d.hp <= 0;
    d.s.mesh.visible = !wrecked;
    d.zone.visible = !wrecked;
    if (wrecked) continue;
    d.mat.color.copy(LIVE_COLOR).lerp(WRECK_COLOR, 1 - d.hp / ELEMENT_HP);
    const mv = moving(d, t);
    d.mat.emissiveIntensity = mv ? 0.25 + 0.25 * Math.sin(t * 18) : 0;   // glows while moving
    const ready = !mv && t - (d.t0 + d.cfg.move) >= TOGGLE_COOLDOWN;
    d.zoneMat.opacity = mv ? 0.45 : ready ? 0.22 : 0.08;                   // dim pad = cooling down
  }
}

// ================= Character mesh (capsule bot) =================
function makeBotMesh(color) {
  const g = new THREE.Group();
  const bodyMat = toon(color), inkMat = toon(INK);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.8, 6, 16), bodyMat);
  body.position.y = 0.8; body.castShadow = true;
  const visor = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.32, 4, 12), inkMat);
  visor.rotation.z = Math.PI / 2; visor.position.set(0, 1.22, -0.33);
  g.add(body, visor);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const ex of [-0.1, 0.1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), eyeMat);
    eye.position.set(ex, 1.23, -0.45); g.add(eye);
  }
  for (const fx of [-0.17, 0.17]) {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8), inkMat);
    foot.scale.set(1, 0.5, 1.3); foot.position.set(fx, 0.06, -0.04); foot.castShadow = true; g.add(foot);
  }
  for (const ax of [-0.5, 0.5]) {
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.3, 4, 8), bodyMat);
    arm.position.set(ax, 0.85, 0); arm.castShadow = true; g.add(arm);
  }
  const wingGeo = new THREE.BoxGeometry(0.9, 0.05, 0.35);
  wingGeo.translate(0.45, 0, 0);
  const wingMat = toon(ACCENT);
  g.userData.wings = [];
  for (const side of [-1, 1]) {
    const wing = new THREE.Mesh(wingGeo, wingMat);
    wing.position.set(0.15 * side, 1.15, 0.3);
    wing.rotation.y = side < 0 ? Math.PI : 0;
    wing.scale.setScalar(0.001);
    g.add(wing); g.userData.wings.push(wing);
  }
  scene.add(g);
  return g;
}

// ================= Players =================
const yawToCenter = (x, z) => Math.atan2(x, z);   // facing (−sin, −cos) points at the origin
// ---------- Names and name plaques ----------
const BOT_NAMES = ['Rosie', 'Hal', 'R2D2', 'Bender', 'Wall-E', 'Marvin', 'Robby', 'Data', 'Baymax', 'Johnny 5', 'Gort', 'Astro'];
function pickBotName() {
  const used = new Set(players.map((p) => p.name));
  const free = BOT_NAMES.filter((n) => !used.has(n));

// Line of sight from the camera to a point: blocked if the segment passes through any solid
function segmentHitsBox(a, b, s) {
  let t0 = 0, t1 = 1;
  for (const ax of ['x', 'y', 'z']) {
    const d = b[ax] - a[ax];
    if (Math.abs(d) < 1e-9) { if (a[ax] < s.min[ax] || a[ax] > s.max[ax]) return false; continue; }
    let ta = (s.min[ax] - a[ax]) / d, tb = (s.max[ax] - a[ax]) / d;
    if (ta > tb) [ta, tb] = [tb, ta];
    t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
    if (t0 > t1) return false;
  }
  return true;
}
function hasLineOfSight(a, b) {
  for (const s of solids) if (s.h > 0.05 && segmentHitsBox(a, b, s)) return false;
  return true;

function makePlayer(slot, isBot) {

// ================= Game state =================
const settings = { lives: 3, bots: 3, skill: 0, mode: 'knockoff', name: 'Player' };
try { const n = localStorage.getItem('shiftarena-name'); if (n) settings.name = cleanName(n); } catch (e) {}
let players = [];
let shots = [];
let matchTime = 0;
let state = 'menu';        // menu | play | over

let mySlot = 0;
let role = 'solo';         // solo | host | client

function clearPlayers() {
  for (const p of players) { scene.remove(p.mesh); scene.remove(p.plaque); scene.remove(p.huh); }
  players = [];
  for (const s of shots) scene.remove(s.mesh);
  shots = [];
}
function humanName(slot) {

  const c = conns.find((k) => k.slot === slot);

}
function startMatch(humanSlots) {
  clearPlayers();
  const botCount = Math.min(settings.bots, 4 - humanSlots.length);
  for (const slot of humanSlots) { const pl = makePlayer(slot, false); setName(pl, humanName(slot)); players.push(pl); }
  let slot = 0;
  for (let b = 0; b < botCount; b++) {
    while (humanSlots.includes(slot)) slot++;
    players.push(makePlayer(slot++, true));
  }
  players.sort((a, b) => a.slot - b.slot);
  for (const p of players) p.lives = settings.lives;

}

// ================= Collision =================
const E = 1e-4;
function overlaps(px, py, pz, s) {
  return px + PLAYER_R > s.min.x + E && px - PLAYER_R < s.max.x - E &&
         pz + PLAYER_R > s.min.z + E && pz - PLAYER_R < s.max.z - E &&
         py + PLAYER_H > s.min.y + E && py < s.max.y - E;
}
function blockedAt(px, py, pz) {
  for (const s of solids) if (overlaps(px, py, pz, s)) return true;
  return false;
}
function moveHorizontal(pl, axis, amount) {
  const p = pl.pos;
  p[axis] += amount;
  for (const s of solids) {
    if (!overlaps(p.x, p.y, p.z, s)) continue;
    if (s.max.y - p.y <= MANTLE_MAX && !blockedAt(p.x, s.max.y + E, p.z)) {
      p.y = s.max.y;
      if (pl.vel.y < 0) pl.vel.y = 0;
      pl.grounded = true; pl.ground = s;
      continue;
    }
    const c = axis === 'x' ? (s.min.x + s.max.x) / 2 : (s.min.z + s.max.z) / 2;
    p[axis] = p[axis] < c ? s.min[axis] - PLAYER_R - E : s.max[axis] + PLAYER_R + E;
    pl.vel[axis] = 0;
  }
}
// Is there something to stand on at (x, z), at or a little below height y?
function groundAt(x, z, y) {
  for (const s of solids) {
    if (x > s.min.x && x < s.max.x && z > s.min.z && z < s.max.z && s.max.y <= y + 0.5 && s.max.y > y - 2.5) return true;
  }
  return false;
}

// ================= Simulation (host / solo only) =================
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function stepPlayer(pl, dt) {
  const p = pl.pos, v = pl.vel, inp = pl.inp;
  pl.prev.copy(p);
  const wasGrounded = pl.grounded, prevGround = pl.ground;

  for (let pass = 0; pass < 2; pass++) {
    for (const s of solids) {
      if (overlaps(p.x, p.y, p.z, s) && s.max.y - p.y < PLAYER_H + 0.2) { p.y = s.max.y; if (v.y < 0) v.y = 0; }
    }
  }
  if (wasGrounded && prevGround && prevGround.dy < 0) p.y += prevGround.dy;
  pl.grounded = false; pl.ground = null;

  fwd.set(-Math.sin(pl.yaw), 0, -Math.cos(pl.yaw));
  right.set(Math.cos(pl.yaw), 0, -Math.sin(pl.yaw));
  const tx = (fwd.x * inp.z + right.x * inp.x) * RUN_SPEED;
  const tz = (fwd.z * inp.z + right.z * inp.x) * RUN_SPEED;
  pl.stun = Math.max(0, pl.stun - dt);
  const accel = pl.stun > 0 ? 0.8 : wasGrounded ? 14 : 5;   // knocked players lose control briefly
  const k = Math.min(1, accel * dt);
  v.x += (tx - v.x) * k;
  v.z += (tz - v.z) * k;

  if (inp.jumpSeq !== pl.lastJumpSeq) { pl.lastJumpSeq = inp.jumpSeq; pl.jumpPressedAt = matchTime; }
  if (wasGrounded) pl.lastGrounded = matchTime;
  if (matchTime - pl.jumpPressedAt < JUMP_BUFFER && matchTime - pl.lastGrounded < COYOTE) {
    v.y = JUMP_VEL; pl.jumpPressedAt = -10; pl.lastGrounded = -10;
  }
  pl.gliding = inp.jump && !wasGrounded && v.y < 0 && pl.glideLeft > 0;
  if (pl.gliding) { v.y = Math.max(v.y - GRAVITY * 0.2 * dt, -GLIDE_FALL); pl.glideLeft -= dt; }
  else v.y -= GRAVITY * dt;

  const prevY = p.y;
  p.y += v.y * dt;
  for (const s of solids) {
    if (!overlaps(p.x, p.y, p.z, s)) continue;
    if (v.y <= 0 && prevY >= s.max.y - 0.3) { p.y = s.max.y; v.y = 0; pl.grounded = true; pl.ground = s; }
    else if (v.y > 0 && prevY + PLAYER_H <= s.min.y + 0.05) { p.y = s.min.y - PLAYER_H - E; v.y = 0; }
  }
  moveHorizontal(pl, 'x', v.x * dt);
  moveHorizontal(pl, 'z', v.z * dt);
  if (pl.grounded) pl.glideLeft = GLIDE_MAX;
}

function angleDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

// Bots only chase what they can see. Out of sight they head to where they last saw you,
// and after a while they forget and wander around looking (shown with a ? over their name).
const BOT_MEMORY = 4;        // seconds a bot remembers where it last saw you
const BOT_LOOK_EVERY = 0.2;  // seconds between sight checks
const eyeA = new THREE.Vector3(), eyeB = new THREE.Vector3();
function botCanSee(pl, o) {
  eyeA.set(pl.pos.x, pl.pos.y + 1.4, pl.pos.z);
  if (hasLineOfSight(eyeA, eyeB.set(o.pos.x, o.pos.y + 1.4, o.pos.z))) return true;
  return hasLineOfSight(eyeA, eyeB.set(o.pos.x, o.pos.y + 0.7, o.pos.z));
}
function pickWanderPoint(b) {
  for (let k = 0; k < 12; k++) {
    const x = (Math.random() - 0.5) * 32, z = (Math.random() - 0.5) * 32;
    if (groundAt(x, z, 0)) { b.wx = x; b.wz = z; b.wanderUntil = matchTime + 4 + Math.random() * 4; return; }
  }
  b.wx = 0; b.wz = 0; b.wanderUntil = matchTime + 3;
}
function thinkBot(pl, dt) {
  const b = pl.bot, inp = pl.inp, p = pl.pos, sk = BOT_SKILLS[settings.skill];
  b.think -= dt;
  if (b.think <= 0) { b.think = 0.4 + Math.random() * 0.4; b.aimErr = (Math.random() - 0.5) * 2 * sk.aim; if (Math.random() < 0.25) b.strafe *= -1; }

  // Look around: nearest player in line of sight becomes the target
  b.look -= dt;
  if (b.look <= 0) {
    b.look = BOT_LOOK_EVERY;
    let seen = null, best = 1e9;
    for (const o of players) {
      if (o === pl || !o.alive) continue;
      const dd = Math.hypot(o.pos.x - p.x, o.pos.z - p.z);
      if (dd < best && botCanSee(pl, o)) { best = dd; seen = o; }
    }
    b.target = seen;
    if (seen) { b.lastX = seen.pos.x; b.lastZ = seen.pos.z; b.lastSeen = matchTime; }
  }
  const target = b.target && b.target.alive ? b.target : null;
  const remembers = !target && matchTime - b.lastSeen < BOT_MEMORY;
  b.lost = !target && !remembers;

  let wantYaw;
  inp.x = 0; inp.fire = false; inp.jump = false;
  if (target) {
    // Seen: chase and shoot
    const best = Math.hypot(target.pos.x - p.x, target.pos.z - p.z);
    wantYaw = Math.atan2(-(target.pos.x - p.x), -(target.pos.z - p.z)) + b.aimErr;
    inp.z = (best > 7 ? 1 : 0.2) * sk.speed;
    inp.x = best < 12 ? 0.5 * b.strafe * sk.speed : 0;
    inp.fire = best < sk.range && Math.abs(angleDiff(wantYaw, pl.yaw)) < 0.3;
  } else if (remembers) {
    // Lost sight: go check where you were last seen
    const dl = Math.hypot(b.lastX - p.x, b.lastZ - p.z);
    wantYaw = Math.atan2(-(b.lastX - p.x), -(b.lastZ - p.z));
    inp.z = dl > 1.5 ? 0.8 * sk.speed : 0;
  } else {
    // Forgot: wander to random spots, looking around
    if (!b.wanderUntil || matchTime > b.wanderUntil || Math.hypot(b.wx - p.x, b.wz - p.z) < 1.5) pickWanderPoint(b);
    wantYaw = Math.atan2(-(b.wx - p.x), -(b.wz - p.z)) + Math.sin(matchTime * 1.3 + pl.slot) * 0.5;
    inp.z = 0.6 * sk.speed;
  }

  // Edge safety: if the path ahead has no floor, back off and turn toward the middle
  fwd.set(-Math.sin(pl.yaw), 0, -Math.cos(pl.yaw));
  right.set(Math.cos(pl.yaw), 0, -Math.sin(pl.yaw));
  const mx = fwd.x * inp.z + right.x * inp.x, mz = fwd.z * inp.z + right.z * inp.x;
  const ml = Math.hypot(mx, mz) || 1;
  if (pl.grounded && (mx || mz) && !groundAt(p.x + (mx / ml) * 1.6, p.z + (mz / ml) * 1.6, p.y)) {
    wantYaw = yawToCenter(p.x, p.z);
    inp.z = 0.6; inp.x = 0; inp.fire = false;
    if (b.lost) pickWanderPoint(b);
  }
  // Falling over a hole: glide back toward the middle
  if (!pl.grounded && p.y < 0.5 && !groundAt(p.x, p.z, p.y)) {
    wantYaw = yawToCenter(p.x, p.z); inp.z = 1; inp.x = 0; inp.jump = true;
  }
  const d = angleDiff(wantYaw, pl.yaw);
  pl.yaw += Math.max(-sk.turn * dt, Math.min(sk.turn * dt, d));
}

const shotGeo = new THREE.SphereGeometry(SHOT_R, 10, 8);
const shotMats = COLORS.map((c) => toon(c));
function spawnShotMesh(slot) {
  const m = new THREE.Mesh(shotGeo, shotMats[slot] || shotMats[0]);
  m.castShadow = true;
  scene.add(m);
  return m;
}
function solidAt(v) {
  for (const s of solids) if (v.x > s.min.x && v.x < s.max.x && v.y > s.min.y && v.y < s.max.y && v.z > s.min.z && v.z < s.max.z) return s;
  return null;
}
function insideSolid(v) { return !!solidAt(v); }
function damageAt(v) {
  const s = solidAt(v);
  if (!s) return false;
  const d = dynamics.find((e) => e.s === s);
  if (d && d.hp > 0) {
    d.hp--;
    if (d.hp <= 0) { setHeight(d.s, 0.001); d.inside.clear(); }
  }
  return true;
}
function updateShots(dt) {
  for (const pl of players) {
    const cd = pl.isBot ? BOT_SKILLS[settings.skill].cooldown : FIRE_COOLDOWN;
    if (!pl.alive || !pl.inp.fire || matchTime - pl.lastShot < cd) continue;
    pl.lastShot = matchTime;
    const f = new THREE.Vector3(-Math.sin(pl.yaw), 0, -Math.cos(pl.yaw));
    const pos = pl.pos.clone().add(new THREE.Vector3(0, 1.0, 0)).addScaledVector(f, 0.6);
    shots.push({ pos, vel: f.multiplyScalar(SHOT_SPEED).add(new THREE.Vector3(0, 2.5, 0)), born: matchTime, owner: pl.slot, mesh: spawnShotMesh(pl.slot) });
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.vel.y -= 9 * dt;
    s.pos.addScaledVector(s.vel, dt);
    let dead = matchTime - s.born > SHOT_LIFE || damageAt(s.pos);
    if (!dead) {
      for (const pl of players) {
        if (!pl.alive || pl.slot === s.owner) continue;
        const dx = s.pos.x - pl.pos.x, dz = s.pos.z - pl.pos.z;
        if (Math.hypot(dx, dz) < PLAYER_R + SHOT_R && s.pos.y > pl.pos.y && s.pos.y < pl.pos.y + PLAYER_H) {
          const hl = Math.hypot(s.vel.x, s.vel.z) || 1;
          pl.vel.x += (s.vel.x / hl) * KNOCK;
          pl.vel.z += (s.vel.z / hl) * KNOCK;
          pl.vel.y = Math.max(pl.vel.y, 0) + KNOCK_UP;
          pl.stun = STUN;
          dead = true;
          break;
        }
      }
    }
    if (dead) { scene.remove(s.mesh); shots.splice(i, 1); }
  }
}

function step(dt) {
  matchTime += dt;
  updateDynamics(matchTime);
  if (state === 'menu') return;
  const frozen = state === 'ready';
  if (!frozen) checkTriggers(matchTime);
  for (const pl of players) {
    if (!pl.alive) {
      if (pl.lives > 0 && matchTime >= pl.respawnAt) placeAtSpawn(pl);
      else continue;
    }
    if (frozen) Object.assign(pl.inp, { x: 0, z: 0, jump: false, fire: false });   // stand still until Start
    else if (pl.isBot) thinkBot(pl, dt);
    stepPlayer(pl, dt);
    if (pl.pos.y < FALL_Y) {
      pl.alive = false;
      pl.mesh.visible = false;
      if (state === 'play') pl.lives--;
      pl.respawnAt = matchTime + RESPAWN_DELAY;
      if (pl.slot === mySlot) flash(pl.lives > 0 ? `You fell! ${pl.lives} left` : 'Out!');
    }
  }
  updateShots(dt);
  if (state === 'play' && players.length >= 2) {
    const left = players.filter((p) => p.lives > 0);
    if (left.length <= 1) { state = 'over'; winner = left.length ? left[0].slot : -1; overAt = matchTime; }
  } else if (state === 'over' && matchTime - overAt > ROUND_END_DELAY) {
    resetRound();
  }
}

const keys = new Set();
let jumpHeld = false, fireHeld = false, strafeHeld = false, jumpSeq = 0;
const input = { x: 0, z: 0, turn: 0 };

addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'enter') { e.preventDefault(); if (!e.repeat) pressJump(); flashBtn('jumpBtn', true); }
  if (k === ' ') { e.preventDefault(); fireHeld = true; flashBtn('fireBtn', true); }
  if (k === 'shift') { strafeHeld = true; flashBtn('strafeBtn', true); }
  keys.add(k);
});
addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'enter') { releaseJump(); flashBtn('jumpBtn', false); }
  if (k === ' ') { fireHeld = false; flashBtn('fireBtn', false); }
  if (k === 'shift') { strafeHeld = false; flashBtn('strafeBtn', false); }
  keys.delete(k);
});
addEventListener('blur', () => {
  keys.clear(); releaseJump(); fireHeld = false; strafeHeld = false;
  for (const id of ['fireBtn', 'jumpBtn', 'strafeBtn']) flashBtn(id, false);
});
// Light up the on-screen button while its key is held

// Nav control (mouse and touch): two circles.
//   Center dot area: nothing.  Inner circle: move + sidestep.  Outer ring: move + turn (more turn farther out).
// With the mouse the circles sit on your character; on touch they sit in the lower left.
const mouse = { held: false, x: 0, y: 0, seen: false };
const NAV_MOUSE = { rin: 84, rout: 150 }, NAV_TOUCH = { rin: 41, rout: 72 };
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse') {
    if (e.button === 0) {
      mouse.held = true; mouse.seen = true; mouse.x = e.clientX; mouse.y = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    return;
  }
  setTouchMode(true);
  if (stick.id === null && e.clientX < innerWidth * 0.6) {
    placeStick();
    stick.id = e.pointerId; stick.x = e.clientX; stick.y = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; return; }
  if (e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; }
});
function endPointer(e) {
  if (e.pointerType === 'mouse') { if (e.button === 0 || e.type === 'pointercancel') mouse.held = false; return; }
  if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.ox; stick.y = stick.oy; }
}
canvas.addEventListener('pointerup', endPointer);

function holdButton(el, down, up) {

    try { el.setPointerCapture(e.pointerId); } catch (err) {}

const stickBase = $('stickBase'), stickInner = $('stickInner'), stickKnob = $('stickKnob');
function setRing(el, cx, cy, r) {
  el.style.width = el.style.height = (2 * r) + 'px';
  el.style.left = (cx - r) + 'px'; el.style.top = (cy - r) + 'px';
}
function placeStick() {

addEventListener('resize', placeStick);
// Turn a pointer offset from the nav center into movement. Returns the zone for the dot color.
function navInput(dx, dy, rin, rout) {
  const r = Math.hypot(dx, dy), dead = rin * 0.25;
  if (r < dead) return { x: 0, z: 0, turn: 0, zone: 'none' };
  const ux = dx / r, uy = dy / r;
  if (r <= rin) {                                   // inner circle: move + sidestep, stronger toward its edge
    const m = (r - dead) / (rin - dead);
    return { x: ux * m, z: -uy * m, turn: 0, zone: 'strafe' };
  }
  const ramp = Math.min(1, (r - rin) / (rout - rin));   // outer ring: sidestep fades into turning
  return { x: ux * (1 - ramp), z: -uy, turn: ux * ramp, zone: 'rotate' };
}
// Nav discs live in a screen-space overlay scene so your character can be drawn on top of them
const navScene = new THREE.Scene();
const navCam = new THREE.OrthographicCamera(0, innerWidth, 0, -innerHeight, -10, 10);
const discMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthTest: false, depthWrite: false });
const outerDisc = new THREE.Mesh(new THREE.CircleGeometry(1, 64), discMat(0xFF8A3D, 0.09));
const innerDisc = new THREE.Mesh(new THREE.CircleGeometry(1, 64), discMat(0x2BB3A8, 0.12));
innerDisc.renderOrder = 1;
navScene.add(outerDisc, innerDisc);
let navVisible = false;
addEventListener('resize', () => { navCam.right = innerWidth; navCam.bottom = -innerHeight; navCam.updateProjectionMatrix(); });
function showNav(cx, cy, nav, dotX, dotY, zone, active, touch) {
  outerDisc.position.set(cx, -cy, 0); outerDisc.scale.setScalar(nav.rout);
  innerDisc.position.set(cx, -cy, 0); innerDisc.scale.setScalar(nav.rin);
  stickKnob.style.left = dotX + 'px'; stickKnob.style.top = dotY + 'px';
  stickKnob.className = (touch ? 'touch ' : '') + zone + (active ? ' active' : '');
}

const hud = $('hud'), helpBtn = $('helpBtn');

    : '<b>Hold mouse</b>: inner circle = move &amp; sidestep, outer ring = move &amp; turn. Dot: gray none, teal sidestep, orange turn<br><b>Space</b> fire &nbsp; <b>Enter</b> jump, hold to glide &nbsp; <b>Shift</b> turns the ring into sidestep';

function refreshHud() {

const tmpProj = new THREE.Vector3();
let dotWasShown = false;
function readInput() {
  let x = 0, z = 0, turn = 0;
  if (keys.has('w') || keys.has('arrowup')) z += 1;
  if (keys.has('s') || keys.has('arrowdown')) z -= 1;
  if (keys.has('d') || keys.has('arrowright')) turn += 1;   // like touch: left/right turns
  if (keys.has('a') || keys.has('arrowleft')) turn -= 1;
  const playing = state !== 'menu';
  const me = localPlayer();
  if (playing && touchMode) {
    const n = navInput(stick.x - stick.ox, stick.y - stick.oy, NAV_TOUCH.rin, NAV_TOUCH.rout);
    if (stick.id !== null) { x += n.x; z += n.z; turn += n.turn; }
    // dot stays inside the outer ring
    let dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const l = Math.hypot(dx, dy);
    if (l > NAV_TOUCH.rout) { dx *= NAV_TOUCH.rout / l; dy *= NAV_TOUCH.rout / l; }
    showNav(stick.ox, stick.oy, NAV_TOUCH, stick.ox + dx, stick.oy + dy, n.zone, stick.id !== null, true);
  } else if (playing && me) {
    // circles centered on your character's chest on screen; the dot is your mouse cursor
    tmpProj.copy(me.mesh.position); tmpProj.y += 1.0; tmpProj.project(camera);
    const cx = (tmpProj.x + 1) / 2 * innerWidth, cy = (1 - tmpProj.y) / 2 * innerHeight;
    const n = navInput(mouse.x - cx, mouse.y - cy, NAV_MOUSE.rin, NAV_MOUSE.rout);
    if (mouse.held) { x += n.x; z += n.z; turn += n.turn; }
    showNav(cx, cy, NAV_MOUSE, mouse.x, mouse.y, n.zone, mouse.held, false);
  }
  const dotShown = playing && (touchMode || mouse.seen);
  if (dotShown !== dotWasShown) { dotWasShown = dotShown; stickKnob.style.display = dotShown ? 'block' : 'none'; }
  if (strafeHeld) { x = THREE.MathUtils.clamp(x + turn, -1, 1); turn = 0; }   // STRAFE button: ring sidesteps too
  const len = Math.hypot(x, z);
  if (len > 1) { x /= len; z /= len; }
  input.x = x; input.z = z; input.turn = THREE.MathUtils.clamp(turn, -1, 1);
}
function applyLocalInput() {
  const me = localPlayer();
  if (!me) return;
  Object.assign(me.inp, { x: input.x, z: input.z, jump: jumpHeld, jumpSeq, fire: fireHeld });
  me.yaw = localYaw;
}

// ================= Online (PeerJS, host-authoritative) =================
let peer = null, conns = [], hostConn = null;
let lastSnapSent = 0, lastInputSent = 0;
let snap = null, snapAt = 0;

function peerAvailable() {
  if (!window.Peer || !window.RTCPeerConnection) {
    status('Online play needs the game hosted on its own page (for example GitHub Pages). This preview blocks peer-to-peer connections.');
    return false;
  }
  return true;
}
function makeCode() {
  const L = 'ABCDEFGHJKMNPQRSTUVWXYZ';
  let c = '';
  for (let i = 0; i < 4; i++) c += L[Math.floor(Math.random() * L.length)];
  return c;
}
function hostLobbyText(code) {
  const names = [settings.name, ...conns.map((c) => cleanName(c.name))].map(esc).join(', ');
  status(`Room code: <b>${code}</b><br>Players: ${names} (${1 + conns.length} of 4). Bots fill the empty spots.`);
}

// ---------- Lobby list of open games (same approach as Baraha) ----------
// The first host to grab the well-known directory ID keeps the list; other hosts register with it.
// If the directory host leaves, another host takes the ID over. No server of our own needed.
const DIR_ID = ROOM_PREFIX + 'directory';
const MODE_NAMES = { knockoff: 'Knock-off', elim: 'Elimination', ctf: 'Capture the flag', koth: 'King of the hill' };
const randInt = (n) => Math.floor(Math.random() * n);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let roomCode = '';

const browse = { peer: null, conn: null, poll: null, retry: null };
function canGoOnline() { return !!(window.Peer && window.RTCPeerConnection); }
function startBrowse() {
  if (!canGoOnline() || role !== 'solo' || peer) {
    if (!canGoOnline()) $('gamesList').innerHTML = '<div class="none">Online games show up here when the game is hosted on its own page (like GitHub Pages).</div>';
    return;
  }
  const p = new Peer(); browse.peer = p;
  p.on('open', browseConnect);
  p.on('error', (err) => {
    if (err.type === 'peer-unavailable') { showGames([]); scheduleBrowse(); }   // nobody is hosting yet
    else if (p.destroyed || err.type === 'network' || err.type === 'server-error') { showGames([]); scheduleRestart(); }
  });
  p.on('disconnected', () => { if (!p.destroyed) p.reconnect(); });
}
function browseConnect() {
  if (!browse.peer || browse.peer.destroyed) return;
  const c = browse.peer.connect(DIR_ID, { reliable: true }); browse.conn = c;
  const giveUp = setTimeout(() => { if (browse.conn === c && !c.open) { try { c.close(); } catch (e) {} showGames([]); scheduleBrowse(); } }, 6000);
  c.on('open', () => {
    clearTimeout(giveUp);
    c.send({ type: 'list' });
    clearInterval(browse.poll);
    browse.poll = setInterval(() => { if (c.open) c.send({ type: 'list' }); }, 4000);
  });
  c.on('data', (m) => { if (m && m.type === 'games') showGames(m.games || []); });
  c.on('close', () => { if (browse.conn === c) { clearInterval(browse.poll); scheduleBrowse(); } });
}
function scheduleBrowse() { clearTimeout(browse.retry); browse.retry = setTimeout(browseConnect, 4000); }
function scheduleRestart() { clearTimeout(browse.retry); browse.retry = setTimeout(refreshGames, 5000); }
function stopBrowse() {
  clearInterval(browse.poll); clearTimeout(browse.retry);
  if (browse.peer) { try { browse.peer.destroy(); } catch (e) {} }
  browse.peer = null; browse.conn = null;
}
function refreshGames() {
  if (role !== 'solo') return;
  stopBrowse();
  $('gamesList').innerHTML = '<div class="none">Looking for open games…</div>';
  $('gamesList').dataset.html = '';
  startBrowse();
}
function showGames(list) {
  const el = $('gamesList');
  // Only redraw when something changed, so a tap on Join isn't lost mid-refresh
  const html = !list.length ? '<div class="none">No open games right now. Host one, or tap Refresh.</div>' : list.map((g) => `<div class="grow"><div>${esc(g.host || 'Player')}'s game · ${esc(MODE_NAMES[g.mode] || 'Knock-off')} · <b>${esc(g.code)}</b><br>
      <span style="color:#5a6675">${g.players} of 4 players · ${g.started ? 'in progress' : 'waiting'}</span></div>
      <button class="small" data-code="${esc(g.code)}"${g.full ? ' disabled' : ''}>${g.full ? 'Full' : 'Join'}</button></div>`).join('');
  if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; }
}
$('gamesList').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-code]');
  if (!b || b.disabled) return;
  $('codeIn').value = b.dataset.code;
  $('joinBtn').click();
});
$('refreshBtn').addEventListener('click', refreshGames);

// Host side of the directory
const dir = { peer: null, isDir: false, regs: new Map(), conn: null, retry: null, last: '' };
function gameInfo() {
  return { code: roomCode, host: settings.name, mode: settings.mode, players: 1 + conns.length, started: state !== 'menu', full: conns.length >= 3 };
}
function listGames() {
  const all = [gameInfo(), ...dir.regs.values()], seen = new Set();
  return all.filter((g) => g && g.code && !seen.has(g.code) && seen.add(g.code));
}
const clampInt = (v, lo, hi, d) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : d; };
function startDirectory() {
  clearTimeout(dir.retry);
  const p = new Peer(DIR_ID);
  p.on('open', () => { dir.peer = p; dir.isDir = true; });
  p.on('connection', (c) => {
    c.on('data', (m) => {
      if (!m || typeof m !== 'object') return;
      if (m.type === 'register' && m.info) dir.regs.set(c, {
        code: String(m.info.code || '').slice(0, 4), host: cleanName(m.info.host), mode: String(m.info.mode || 'knockoff').slice(0, 12),
        players: clampInt(m.info.players, 0, 4, 1), started: !!m.info.started, full: !!m.info.full,
      });
      else if (m.type === 'list') c.send({ type: 'games', games: listGames() });
    });
    const drop = () => dir.regs.delete(c);
    c.on('close', drop); c.on('error', drop);
  });
  p.on('error', (err) => {
    if (dir.isDir) return;
    try { p.destroy(); } catch (e) {}
    if (err.type === 'unavailable-id') registerWithDirectory();   // someone else keeps the list
    else scheduleDir();
  });
  p.on('disconnected', () => { if (!p.destroyed) p.reconnect(); });
}
function registerWithDirectory() {
  if (!peer || peer.destroyed) return;
  const c = peer.connect(DIR_ID, { reliable: true }); dir.conn = c; dir.last = '';
  const giveUp = () => { if (dir.conn === c) { dir.conn = null; try { c.close(); } catch (e) {} scheduleDir(); } };
  const t = setTimeout(() => { if (!c.open) giveUp(); }, 8000);
  c.on('open', () => { clearTimeout(t); dirUpdate(); });
  c.on('close', giveUp); c.on('error', giveUp);
}
function scheduleDir() { clearTimeout(dir.retry); dir.retry = setTimeout(startDirectory, 1000 + randInt(3000)); }
function dirUpdate() {
  if (!dir.conn || !dir.conn.open) return;
  const info = JSON.stringify(gameInfo());
  if (info === dir.last) return;
  dir.last = info;
  dir.conn.send({ type: 'register', info: gameInfo() });
}
setInterval(() => { if (role === 'host') dirUpdate(); }, 2000);

$('hostBtn').addEventListener('click', () => {
  if (!haveName() || !peerAvailable() || peer) return;
  stopBrowse();
  role = 'host'; mySlot = 0;
  const code = makeCode();
  roomCode = code;
  status('Creating room…');
  peer = new Peer(ROOM_PREFIX + code);
  peer.on('open', () => { hostLobbyText(code); $('startBtn').style.display = 'block'; startDirectory(); });
  peer.on('error', (e) => status('Online error: ' + e.type + '. Try again.'));
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      const used = new Set([0, ...conns.map((c) => c.slot)]);
      let slot = -1;
      for (let s = 1; s < 4; s++) if (!used.has(s)) { slot = s; break; }
      if (slot < 0) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 300); return; }
      conn.slot = slot;
      conns.push(conn);
      conn.send({ t: 'welcome', slot });
      if (state === 'menu') hostLobbyText(code);
      else {
        // Joined mid-match: take over a bot in that slot, or add a new player
        const existing = players.find((p) => p.slot === slot);
        if (existing) { existing.isBot = false; existing.human = true; setName(existing, cleanName(conn.name)); }
        else { const np = makePlayer(slot, false); setName(np, cleanName(conn.name)); np.lives = settings.lives; players.push(np); players.sort((a, b) => a.slot - b.slot); }
      }
    });
    conn.on('data', (d) => {
      if (!d) return;
      if (d.t === 'hello') {
        conn.name = cleanName(d.name);
        const hp = players.find((p) => p.slot === conn.slot);
        if (hp && !hp.isBot) setName(hp, conn.name);
        if (state === 'menu') hostLobbyText(code);
        return;
      }
      if (d.t !== 'i') return;
      const pl = players.find((p) => p.slot === conn.slot);
      if (!pl) return;
      pl.inp.x = +d.x || 0; pl.inp.z = +d.z || 0; pl.inp.jump = !!d.jh; pl.inp.fire = !!d.f;
      pl.inp.jumpSeq = d.j | 0; pl.yaw = +d.y || 0;
    });
    conn.on('close', () => {
      conns = conns.filter((c) => c !== conn);
      const pl = players.find((p) => p.slot === conn.slot);
      if (pl) { pl.isBot = true; pl.human = false; setName(pl, pickBotName()); }   // a bot takes over
      if (state === 'menu') hostLobbyText(code);
    });
  });
});
$('startBtn').addEventListener('click', () => {
  if (role !== 'host') return;
  startMatch([0, ...conns.map((c) => c.slot)]);
  hideMenu();
});

$('joinBtn').addEventListener('click', () => {
  if (!haveName() || !peerAvailable() || peer) return;
  const code = $('codeIn').value.trim().toUpperCase();
  if (code.length !== 4) { status('Enter the 4-letter room code.'); return; }
  stopBrowse();
  role = 'client';
  status('Connecting…');
  peer = new Peer();
  peer.on('error', (e) => {
    status(e.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Online error: ' + e.type);
    if (peer) { peer.destroy(); peer = null; }
    role = 'solo';
    setTimeout(refreshGames, 500);
  });
  peer.on('open', () => {
    hostConn = peer.connect(ROOM_PREFIX + code, { serialization: 'json' });
    hostConn.on('open', () => { hostConn.send({ t: 'hello', name: settings.name }); status('Connected. Waiting for the host to start…'); });
    hostConn.on('data', onClientData);
    hostConn.on('close', () => { flash('Disconnected from host'); });
  });
});

function packSnapshot() {
  const r2 = (v) => Math.round(v * 100) / 100;
  return {
    t: 's', mt: r2(matchTime), st: state, w: winner,
    ps: players.map((p) => [p.slot, r2(p.pos.x), r2(p.pos.y), r2(p.pos.z), r2(p.yaw), p.lives, p.alive ? 1 : 0, p.gliding ? 1 : 0, p.isBot ? 1 : 0, p.isBot && p.bot.lost ? 1 : 0]),
    sh: shots.map((s) => [s.owner, r2(s.pos.x), r2(s.pos.y), r2(s.pos.z)]),
    dy: dynamics.map((d) => [d.up ? 1 : 0, r2(d.from), r2(d.to), r2(d.t0), d.hp]),
    nm: players.map((p) => p.name),
  };
}
function onClientData(d) {
  if (!d) return;
  if (d.t === 'welcome') { mySlot = d.slot; }
  else if (d.t === 'full') { status('That room is full.'); }
  else if (d.t === 's') {
    snap = d; snapAt = performance.now();
    if (state === 'menu') { hideMenuForClient(); }
    state = d.st; winner = d.w;
    applySnapshotStructure(d);
  }
}
function hideMenuForClient() {
  if (document.activeElement) document.activeElement.blur();
  $('menu').style.display = 'none';
  state = 'play';
  refreshHud();
}
// Clients keep one visual player per slot, updated from snapshots
function applySnapshotStructure(d) {
  if (d.dy) d.dy.forEach((row, i) => { const e = dynamics[i]; if (e) { e.up = !!row[0]; e.from = row[1]; e.to = row[2]; e.t0 = row[3]; if (row[4] != null) e.hp = row[4]; } });
  const seen = new Set();
  for (const row of d.ps) {
    const [slot, x, y, z, yaw, lives, alive, glide, isBot, lost] = row;
    seen.add(slot);
    let pl = players.find((p) => p.slot === slot);
    if (!pl) {
      pl = makePlayer(slot, !!isBot);
      pl.pos.set(x, y, z); pl.disp.set(x, y, z);
      players.push(pl); players.sort((a, b) => a.slot - b.slot);
      if (slot === mySlot) localYaw = yaw;
    }
    const wasAlive = pl.alive;
    pl.pos.set(x, y, z);
    if (slot !== mySlot) pl.yaw = yaw;
    if (slot === mySlot && wasAlive && !alive) flash(lives > 0 ? `You fell! ${lives} left` : 'Out!');
    if (!wasAlive && alive) { pl.disp.set(x, y, z); pl.visInit = false; if (slot === mySlot) localYaw = yaw; }
    pl.lives = lives; pl.alive = !!alive; pl.gliding = !!glide; pl.isBot = !!isBot; pl.bot.lost = !!lost;
    const nmi = d.ps.indexOf(row);
    if (d.nm && d.nm[nmi] != null) setName(pl, cleanName(d.nm[nmi]));
    pl.mesh.visible = pl.alive;
  }
  for (const p of [...players]) if (!seen.has(p.slot)) { scene.remove(p.mesh); scene.remove(p.plaque); scene.remove(p.huh); players = players.filter((q) => q !== p); }
  // shots
  while (shots.length > d.sh.length) scene.remove(shots.pop().mesh);
  d.sh.forEach((row, i) => {
    if (!shots[i]) shots[i] = { mesh: spawnShotMesh(row[0]), pos: new THREE.Vector3() };
    shots[i].mesh.material = shotMats[row[0]] || shotMats[0];
    shots[i].mesh.position.set(row[1], row[2], row[3]);
  });
}

function netTick(now) {
  if (role === 'host' && conns.length && state !== 'menu' && now - lastSnapSent > SNAP_RATE * 1000) {
    lastSnapSent = now;
    const s = packSnapshot();
    for (const c of conns) if (c.open) c.send(s);
  }
  if (role === 'client' && hostConn && hostConn.open && now - lastInputSent > INPUT_RATE * 1000) {
    lastInputSent = now;
    const r3 = (v) => Math.round(v * 1000) / 1000;
    hostConn.send({ t: 'i', x: r3(input.x), z: r3(input.z), y: r3(localYaw), j: jumpSeq, jh: jumpHeld ? 1 : 0, f: fireHeld ? 1 : 0 });
  }
}

// ================= Camera & render =================
const camPos = new THREE.Vector3(), camTarget = new THREE.Vector3();
let camInit = false, camY = 0;
function updateFov() {
  const aspect = innerWidth / innerHeight;
  const vfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(45)) / aspect);
  camera.fov = THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(vfov), 55, 95);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
updateFov();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); updateFov(); });

const tmp = new THREE.Vector3(), tmpEye = new THREE.Vector3();
function render(dt, alpha) {
  const tRender = role === 'client' && snap ? snap.mt + (performance.now() - snapAt) / 1000 : matchTime - STEP * (1 - alpha);

  for (const pl of players) {
    if (role === 'client') {
      // smooth toward the latest snapshot
      if (!pl.visInit) pl.disp.copy(pl.pos);
      pl.disp.lerp(pl.pos, Math.min(1, dt * 14));
      tmp.copy(pl.disp);
    } else {
      tmp.copy(pl.prev).lerp(pl.pos, alpha);
    }
    pl.visY = pl.visInit ? pl.visY + (tmp.y - pl.visY) * Math.min(1, dt * 16) : tmp.y;
    pl.visInit = true;
    pl.mesh.position.set(tmp.x, pl.visY, tmp.z);
    pl.mesh.rotation.y = pl.slot === mySlot ? localYaw : pl.yaw;
    const onTop = pl.slot === mySlot;
    if (pl.onTop !== onTop) { pl.onTop = onTop; pl.mesh.traverse((o) => { if (onTop) o.layers.enable(1); else o.layers.disable(1); }); }
    for (const w of pl.mesh.userData.wings) {
      const target = pl.gliding ? 1 : 0.001;
      w.scale.setScalar(Math.max(w.scale.x + (target - w.scale.x) * Math.min(1, dt * 14), 0.001));
    }
  }
  if (role !== 'client') for (const s of shots) s.mesh.position.copy(s.pos);

  // Camera follows you, or the first player still in when you're out
  let follow = localPlayer();
  if (follow && !follow.alive && follow.lives <= 0) follow = players.find((p) => p.alive) || follow;
  const fy = follow ? follow.mesh.position : tmp.set(0, 0, 0);
  const yaw = follow && follow.slot === mySlot ? localYaw : follow ? follow.yaw : 0;
  const dist = 5.2, shoulder = 0.75;
  fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  right.set(Math.cos(yaw), 0, -Math.sin(yaw));
  const targetY = Math.max(fy.y, -2);
  camY = camInit ? camY + (targetY - camY) * Math.min(1, dt * 6) : targetY;
  camTarget.set(fy.x, camY + 1.45, fy.z).addScaledVector(right, shoulder);
  camPos.copy(camTarget).addScaledVector(fwd, -Math.cos(PITCH) * dist);
  camPos.y += Math.sin(PITCH) * dist;
  if (!camInit) { camera.position.copy(camPos); camInit = true; }
  camera.position.lerp(camPos, Math.min(1, dt * 18));
  camera.lookAt(camTarget);

  drawDynamics(tRender);
  // Name plaques: only for players you can actually see (hidden behind cover = no plaque)
  for (const pl of players) {
    const head = pl.mesh.position;
    pl.plaque.position.set(head.x, head.y + 1.95, head.z);
    let seen = false;
    if (pl.slot !== mySlot && pl.alive && pl.mesh.visible) {
      seen = hasLineOfSight(camera.position, tmpEye.set(head.x, head.y + 1.5, head.z)) ||
             hasLineOfSight(camera.position, tmpEye.set(head.x, head.y + 0.8, head.z));
    }
    pl.plaque.visible = seen;
    pl.huh.position.copy(pl.plaque.position);
    pl.huh.visible = seen && pl.isBot && pl.bot.lost;   // bot doesn't know where anyone is
  }
  const me = localPlayer();
  $('glideBar').style.width = (me && role !== 'client' ? 100 * Math.max(me.glideLeft, 0) / GLIDE_MAX : 100) + '%';
  // Pass 1: the world.  Pass 2: nav discs.  Pass 3: your own character again, on top of the discs.
  renderer.clear();
  renderer.shadowMap.autoUpdate = true;
  renderer.render(scene, camera);
  if (navVisible) {
    renderer.render(navScene, navCam);
    const me = localPlayer();
    if (me && me.alive && !touchMode) {
      renderer.clearDepth();
      renderer.shadowMap.autoUpdate = false;
      camera.layers.set(1);
      renderer.render(scene, camera);
      camera.layers.set(0);
    }
  }
}

// ================= Start Game button (host / solo) =================
const goBtn = document.getElementById('goBtn');
goBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
goBtn.addEventListener('click', () => {
  if (state !== 'ready' || role === 'client') return;
  state = 'play';
  goBtn.blur();
});

// ================= Main loop =================
setTouchMode(touchMode);
startBrowse();
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  readInput();
  localYaw -= input.turn * TURN_RATE * dt;
  if (role !== 'client') {
    applyLocalInput();
    acc += dt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
  }
  netTick(now);
  if (state !== 'menu') updateScoreUi(dt);
  const showGo = state === 'ready' && role !== 'client';
  if (goBtn.style.display !== (showGo ? 'block' : 'none')) goBtn.style.display = showGo ? 'block' : 'none';
  render(dt, role === 'client' ? 1 : acc / STEP);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
